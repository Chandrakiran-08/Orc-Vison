name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and ARM64 runners, per SPEC. CPU-only: no GPU, no
        # RealSense, no microcontroller hardware is exercised in CI.
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (base + cpu + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cpu,dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Smoke — doctor & info
        run: |
          python -m orcvision doctor
          python -m orcvision info

      - name: Tests (no hardware required)
        run: pytest -q
